<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account | NZ Mathematics Academy</title><link rel="stylesheet" href="/assets/css/access.css"><link rel="stylesheet" href="/assets/css/nz-watermark.css"></head><body><main class="simple-panel"><a class="back-link" href="/">← Academy home</a><h1>My account</h1><p>Update your profile and manage your password. Email changes require your current password; parent email corrections are handled by an administrator.</p><form id="profile-form"><div class="field-grid"><label>First name<input name="firstName" required maxlength="80"></label><label>Surname<input name="surname" required maxlength="80"></label><label>Email<input name="email" type="email" maxlength="254" readonly></label><label id="admin-email-password-field" class="hidden">Current password to confirm email change<input name="adminEmailPassword" type="password" maxlength="256" autocomplete="current-password"></label><label id="date-of-birth-field">Date of birth<input name="dateOfBirth" type="date"></label><label id="address-field" class="wide">Address<textarea name="address" maxlength="500" rows="2"></textarea></label><label id="school-year-field">School year<select name="schoolYear"><option value="">Choose a year</option><option>Year 6</option><option>Year 7</option><option>Year 8</option><option>Year 9</option><option>Year 10</option><option>Year 11</option><option>Year 12</option><option>Year 13</option><option>Adult / other</option></select></label></div><fieldset id="account-guardian"><legend>Parent or guardian (if under 18)</legend><div class="field-grid"><label>Name<input name="parentName" maxlength="160"></label><label>Email<input name="parentEmail" type="email" maxlength="254" readonly></label></div></fieldset><button class="primary-button" type="submit">Save profile</button><p id="profile-status" class="form-status" role="status" aria-live="polite"></p></form><hr><h2>Change password</h2><form id="password-form"><label>Current password<input name="currentPassword" type="password" required autocomplete="current-password"></label><label>New password<input name="newPassword" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><button class="primary-button" type="submit">Update password</button><p id="password-status" class="form-status" role="status" aria-live="polite"></p></form><button id="sign-out" class="primary-button" type="button">Sign out</button></main><script src="/account.js" defer></script></body></html>
